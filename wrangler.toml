name = "ai-fitness-coach"
main = "worker/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "ai-fitness-coach-db"
database_id = "6d4b6c45-e5d6-4daa-bb7d-9b6030728a84"
migrations_dir = "migrations"

# Set the real secret with: wrangler secret put GEMINI_API_KEY
# Get a free key (no credit card) at https://aistudio.google.com/apikey
# For local dev, put it in .dev.vars instead (see .dev.vars.example)
