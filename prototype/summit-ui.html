<title>Summit Streak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one phone-width app column (top bar / view / bottom nav). Single vibrant cel-shaded world, light by choice. */
:root{
  --ink:#16202b; --paper:#fffdf7; --line:#e7e2d6; --muted:#5f6b78; --ground:#d9f3ff;
  --sky:#5fd0ff; --grass:#7fe06a; --pine:#14b85a; --pine-d:#0b8a41; --river:#1a9dff;
  --rock:#a3adc2; --rock-d:#6f7a92; --snow:#ffffff;
  --ember:#ff4f12; --ember-d:#d63a00; --gold:#ffcc12; --gold-d:#e09a00;
  --falcon:#2f6df6; --falcon-d:#1d4fc4; --good:#14b85a; --soft:#fff1e0;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-weight:700;display:flex;justify-content:center}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--river);outline-offset:2px}
.app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;background:var(--paper);border-left:3px solid var(--ink);border-right:3px solid var(--ink);position:relative;overflow:hidden}
.top{display:flex;align-items:center;gap:8px;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));border-bottom:3px solid var(--ink);background:var(--paper);z-index:3}
.when{flex:1;min-width:0;line-height:1.1}
.when b{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.3px}
.when small{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border:2.5px solid var(--ink);border-radius:20px;background:#fff;font-weight:900;font-size:13px;font-variant-numeric:tabular-nums}
.chip.fire{background:var(--ember);color:#fff}
.chip.coin{background:var(--gold)}
.icon{border:0;background:none;font-size:18px;cursor:pointer;padding:4px}
.view{flex:1;overflow-y:auto;position:relative;scrollbar-width:thin}
.pad{padding:14px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.nav{display:flex;border-top:3px solid var(--ink);background:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:0;background:none;padding:8px 0 9px;font-weight:900;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.nav button b{font-size:20px;line-height:1}
.nav button[aria-current=page]{color:var(--ember)}
.lbl{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:900}
.btn{font:900 15px var(--body);border:3px solid var(--ink);border-radius:14px;padding:11px 14px;background:var(--ember);color:#fff;box-shadow:0 4px 0 var(--ink);cursor:pointer;width:100%}
.btn.alt{background:#fff;color:var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
/* coach */
.coach{display:flex;gap:8px;align-items:flex-end}
.coach svg{flex:none}
.bubble{background:#fff;border:3px solid var(--ink);border-radius:14px 14px 14px 4px;padding:8px 11px;font-size:14px;font-weight:800;flex:1;min-width:0}
@keyframes bob{50%{transform:translateY(-4px)}}
.bob{animation:bob 1.6s ease-in-out infinite}
/* progress */
.prog{display:flex;align-items:center;gap:10px}
.prog b{font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{flex:1;height:14px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.meter div{height:100%;background:repeating-linear-gradient(-45deg,var(--ember) 0 8px,#ff8a3d 8px 16px);transition:width .35s cubic-bezier(.3,1.6,.5,1)}
/* tasks: simple list in one card */
.list{background:#fff;border:3px solid var(--ink);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:7px 12px;border:0;border-top:1.5px solid var(--line);background:none;text-align:left;font-size:15px;font-weight:800;cursor:pointer}
.row:first-child{border-top:0}
.row .ck{width:22px;height:22px;flex:none;border:2.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;transition:background .15s,transform .15s}
.row .em{width:22px;text-align:center;flex:none}
.row .t{flex:1;min-width:0}
.row.on .ck{background:var(--good);border-color:var(--good)}
.row.on .t{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}
.row[disabled]{cursor:default}
@keyframes pop{40%{transform:scale(1.35)}}
.row.pop .ck{animation:pop .25s}
.fold{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:4px 2px;font-weight:900;font-size:13px;color:var(--muted);cursor:pointer}
.note{border-radius:14px;padding:9px 12px;font-size:13.5px;font-weight:800;background:#e3f6ff;border:2.5px solid var(--ink)}
.note.warm{background:var(--soft)}
.result{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:16px;padding:10px 12px}
.result .g{font-family:var(--display);font-size:38px;line-height:1;color:var(--gold);min-width:48px;text-align:center}
.result p{margin:0;font-size:13px;flex:1;min-width:0}
.result button{border:0;background:none;color:#fff;font-size:18px;cursor:pointer}
/* map */
.map svg{display:block;width:100%}
.mapnode{cursor:pointer}
/* power-up */
.power{position:absolute;inset:0;z-index:9;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle,#fff27a 0,var(--gold) 25%,var(--ember) 60%,var(--ember-d) 100%);text-align:center;color:#fff}
.power h2{font-family:var(--display);font-weight:400;font-size:38px;margin:4px 0 0;-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.power p{margin:6px 24px 16px;font-weight:900;font-size:15px;color:var(--ink);background:rgba(255,255,255,.85);border:2.5px solid var(--ink);border-radius:14px;padding:8px 14px}
.power .btn{background:#fff;color:var(--ink);width:auto;padding:10px 22px}
.rays{position:absolute;inset:-60%;background:repeating-conic-gradient(rgba(255,255,255,.25) 0 10deg,transparent 10deg 20deg);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes zap{0%{transform:scale(.2) rotate(-15deg)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.power .in{position:relative;animation:zap .5s cubic-bezier(.3,1.6,.5,1)}
/* journal */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{flex:1;border:2.5px solid var(--ink);border-radius:12px;padding:7px 0;background:#fff;font-weight:900;font-size:13px;cursor:pointer}
.tab[aria-selected=true]{background:var(--ink);color:var(--gold)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px;background:#fff}
.stats b{font-family:var(--display);font-weight:400;font-size:26px;display:block;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:3px solid var(--ink)}
.bars i{flex:1;min-width:0;border-radius:3px 3px 0 0;background:var(--gold);border:1.5px solid var(--ink);border-bottom:0}
.bars i.p{background:var(--ember)}
.bars i.x{background:none;border-style:dashed;height:4%}
.scale{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.scale span{display:inline-flex;gap:4px;align-items:center}
.scale em{font-style:normal;font-family:var(--display);color:var(--ink);font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal span{font-size:10px;text-align:center;color:var(--muted);font-weight:900}
.cal button{aspect-ratio:1;min-width:0;border:2.5px solid var(--ink);border-radius:9px;background:#fff;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-weight:900;font-size:11px}
.cal button em{font-style:normal;font-family:var(--display);font-size:14px}
.cal .p{background:var(--ember);color:#fff}
.cal .ok{background:var(--gold)}
.cal .lo{background:#ffd3c4}
.cal .nr{background:#eef0f4;color:var(--muted)}
.cal .today{background:var(--sky)}
.cal .sel{outline:3px solid var(--falcon);outline-offset:1px}
.cal button:disabled{background:transparent;border-style:dashed;border-color:var(--rock);color:var(--rock);cursor:default}
.lock{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:900;background:var(--ink);color:var(--gold);padding:4px 10px;border-radius:10px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{border:2.5px solid var(--ink);border-radius:14px;padding:8px 4px;text-align:center;font-size:11.5px;font-weight:900;background:#fff}
.badge b{display:block;font-size:26px;line-height:1.15}
.badge.on{background:#fff6cc}
.badge.off{opacity:.35;filter:grayscale(1)}
.hist{display:flex;flex-direction:column;gap:6px}
.hist div{display:flex;justify-content:space-between;gap:8px;border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;background:#fff;font-size:13px}
label.f{display:flex;flex-direction:column;gap:4px}
input[type=text],textarea{font:800 15px var(--body);border:2.5px solid var(--ink);border-radius:12px;padding:9px 11px;width:100%;background:#fff;color:var(--ink)}
textarea{min-height:200px;font-size:14px;line-height:1.45;resize:vertical}
.lens{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lens button{border:2.5px solid var(--ink);border-radius:12px;padding:8px 0;background:#fff;font-weight:900;cursor:pointer}
.lens button[aria-pressed=true]{background:var(--river);color:#fff}
.toast{position:absolute;left:16px;right:16px;bottom:76px;z-index:8;background:var(--ink);color:#fff;border-radius:12px;padding:9px 12px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <div class="top">
    <div class="when"><b id="dayLbl">Day 4 of 30</b><small id="clock">Loading…</small></div>
    <span class="chip fire" id="streak" title="Perfect streak">🔥 0</span>
    <span class="chip coin" id="coins" title="Coins">● 60</span>
    <button class="icon" id="mute" aria-label="Sound on">🔊</button>
  </div>
  <div class="view" id="view"></div>
  <nav class="nav">
    <button data-v="map"><b>⛰</b>Map</button>
    <button data-v="today"><b>✓</b>Today</button>
    <button data-v="journal"><b>☰</b>Journal</button>
  </nav>
</div>

<script>
// ---------- data ----------
const T20=["💪 Daily strength (20–30 min)","🤸 Mobility training (10–15 min)","👟 Walk 10k steps (20k optimal)","✍️ Write 1–2 shitty pages","🎧 Make 1 shitty beat","📖 Read a book (10 pages)","🦶 Ground barefoot","☀️ Morning sunlight (5 min)","🥗 Eat clean: protein + fiber","📊 Track progress","🧘 Meditate (5 min)","🗣 Learn a language (5 min)","💧 Hydration / vits / supplements","🪑 Sit on the floor (5 min)","💬 Positive affirmations","🗓 Plan tomorrow (evening)","😴 Sleep 8–9 hours","📓 Journal your day","📵 Be conscious of screen time","📚 Study for 1 hour"];
// Starting state: your challenge began Nov 5 2026. Nov 5–6 have no record; Nov 7 from your checklist.
const SEED={v:1,cur:0,seen:{},ch:[{name:"30 Day Challenge",start:"2026-11-05",len:30,tasks:T20,status:"active",days:{"2026-11-05":null,"2026-11-06":null,"2026-11-07":[5,6,7,8,11,12]}}]};
const COIN=10,BONUS=50;
let S=JSON.parse(JSON.stringify(SEED)),ready=false,view="today",tab="stats",sel=null,showDone=false,muted=false,lastPct=-1;
const $=s=>document.querySelector(s);
const C=()=>S.ch[S.cur], N=()=>C().tasks.length;
const split=t=>{const m=t.match(/^(\S+)\s+(.*)$/);return m&&!/[A-Za-z0-9]/.test(m[1])?[m[1],m[2]]:["•",t]};

// ---------- dates ----------
const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const dayN=k=>Math.round((parse(k)-parse(C().start))/864e5)+1;
const keyN=n=>{const d=parse(C().start);d.setDate(d.getDate()+n-1);return keyOf(d)};
const todayN=()=>dayN(keyOf(new Date()));

// ---------- scoring ----------
const rec=n=>C().days[keyN(n)];            // array | null (no record) | undefined (nothing done)
const pctN=n=>{const r=rec(n);return r===null?null:Math.round((r||[]).length/N()*100)};
const perfect=n=>pctN(n)===100;
const runTo=n=>{let k=0;while(n>=1&&perfect(n)){k++;n--}return k};
function grade(n){const p=pctN(n);if(p==null)return"–";if(p===100)return runTo(n)>=2?"S+":"S";return p>=85?"A":p>=70?"B":p>=50?"C":p>0?"D":"F"}
const coinsN=n=>{const r=rec(n)||[];return r.length*COIN+(r.length===N()?BONUS:0)};
function totals(){const T=Math.min(todayN(),C().len);let coins=0,P=0,best=0,run=0;
  for(let n=1;n<=T;n++){coins+=coinsN(n);if(perfect(n)){P++;run++;best=Math.max(best,run)}else if(n<T)run=0}
  const cur=perfect(T)?runTo(T):runTo(T-1);
  return{coins,P,best,cur,T}}
// per-task trends → insights
function insights(){const T=Math.min(todayN(),C().len),out=[];
  C().tasks.forEach((t,i)=>{const[em,name]=split(t);let run=0,n=(rec(T)||[]).includes(i)?T:T-1;
    while(n>=1&&(rec(n)||[]).includes(i)){run++;n--}
    let miss=0;n=T-1;while(n>=1&&rec(n)!==null&&!(rec(n)||[]).includes(i)){miss++;n--}
    if(run>=2)out.push({k:"good",s:run,t:`${em} ${name}: ${run} days in a row. Great job, keep it rolling!`});
    if(miss>=2)out.push({k:"warm",s:miss,t:`${em} ${name} slipped ${miss} days running. Do it early today and break the pattern. You've got this.`})});
  return out.sort((a,b)=>b.s-a.s)}

// ---------- falcon coach (original, cel-shaded) ----------
function falcon(size,mood){
 const wings=mood>1
  ?`<path d="M21 38 C11 35 3 26 2 12 C7 17 9 18 12 18 C11 21 13 22 16 22 C15 25 17 27 22 29z" fill="#2a54b8"/><path d="M43 38 C53 35 61 26 62 12 C57 17 55 18 52 18 C53 21 51 22 48 22 C49 25 47 27 42 29z" fill="#2a54b8"/>`
  :`<path d="M20 35 C14 45 16 55 24 62 L28 44z" fill="#2a54b8"/><path d="M44 35 C50 45 48 55 40 62 L36 44z" fill="#2a54b8"/>`;
 const eyes=mood>1
  ?`<path d="M24.5 21.5 q2.5 -3 5 0 M34.5 21.5 q2.5 -3 5 0" fill="none" stroke="#ffcc12" stroke-width="2.4"/>`
  :`<circle cx="27" cy="21" r="3.6" fill="#ffcc12"/><circle cx="37" cy="21" r="3.6" fill="#ffcc12"/><circle cx="27.4" cy="21" r="2.3" fill="#16202b" stroke="none"/><circle cx="37.4" cy="21" r="2.3" fill="#16202b" stroke="none"/><circle cx="28.2" cy="20.2" r=".8" fill="#fff" stroke="none"/><circle cx="38.2" cy="20.2" r=".8" fill="#fff" stroke="none"/>`;
 return`<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true"><g stroke="#16202b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
 <path d="M27 56 L32 63 L37 56z" fill="#2a54b8"/>
 <ellipse cx="32" cy="44" rx="13" ry="15" fill="#3f78f0"/>
 <path d="M32 29 C40 31 45 38 45 45 C45 53 39 59 32 59z" fill="#2a54b8" stroke="none"/>
 <ellipse cx="32" cy="46" rx="8" ry="10" fill="#fff6e2"/>
 <path d="M28 42 l2 1.5 2-1.5 2 1.5 2-1.5 M27.5 47 l2 1.5 2.5-1.5 2.5 1.5 2-1.5 M29 52 l1.5 1 1.5-1 1.5 1 1.5-1" fill="none" stroke-width="1.4"/>
 <ellipse cx="32" cy="44" rx="13" ry="15" fill="none"/>
 ${wings}
 <circle cx="32" cy="21" r="12.5" fill="#fff6e2"/>
 <path d="M19.6 22 C19.6 12 25 8.5 32 8.5 C39 8.5 44.4 12 44.4 22 C44.4 26 43 29 40.5 31.5 C39.5 28 38.5 26.5 37 26 C34 27 30 27 27 26 C25.5 26.5 24.5 28 23.5 31.5 C21 29 19.6 26 19.6 22z" fill="#1b2f6b"/>
 ${eyes}
 <path d="M29.6 24.5 h4.8 c.4 3 -.6 5.4 -2.2 7.4 c-1.4 -1.2 -2.4 -2.6 -2.6 -4z" fill="#ffcc12"/>
 <path d="M32.3 30 l.9 1.6" stroke-width="1.8"/>
 </g></svg>`}

// ---------- sound ----------
let ac;
function tone(f,t=0,d=.12,type="square",v=.05){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t+d);o.connect(g).connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d)}catch(e){}}
const sfx={check:n=>{const f=440*Math.pow(2,(n%12)/12);tone(f);tone(f*1.5,.06)},un:()=>tone(200,0,.1,"triangle"),win:()=>[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.08,.28)),tap:()=>tone(660,0,.05,"triangle",.03)};

// ---------- storage: private per-user db doc, local fallback ----------
let ref=null,writing=Promise.resolve(),saveT;
function save(){try{localStorage.setItem("summit",JSON.stringify(S))}catch(e){}
  if(!ref)return;clearTimeout(saveT);saveT=setTimeout(()=>{const data=JSON.parse(JSON.stringify(S));
   writing=writing.then(()=>ref.set(data)).catch(()=>toast("Couldn't save your progress. Check your connection and try again."))},500)}
async function boot(){
  try{const c=window.claude;if(c&&c.use){
    const [db,u]=await Promise.race([Promise.all([c.use("db"),c.use("user")]),new Promise(r=>setTimeout(()=>r([null,null]),10000))]);
    const id=u&&await u.id();
    if(db&&id){ref=db.collection("data/users/"+id).doc("summit");const s=await ref.get();if(s.exists&&s.data().ch)S=JSON.parse(JSON.stringify(s.data()));}}}catch(e){ref=null}
  if(!ref){try{const j=localStorage.getItem("summit");if(j)S=JSON.parse(j)}catch(e){}}
  ready=true;render()}

// ---------- ui helpers ----------
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;$("#app").appendChild(d);setTimeout(()=>d.remove(),3500)}
function coachLine(p,done,n){const h=new Date().getHours(),left=n-done;
  if(p===100)return["PERFECT DAY! Fully charged. We climb today!",2];
  if(p===0)return[h<12?"Morning! Sunlight and water first. Easy wins to start the climb.":h<18?"Afternoon check-in. One task gets the engine going.":"Evening push. Even a few tasks today keeps you in the fight.",0];
  if(p>=90)return[`Only ${left} left. Finish strong and we fly up the mountain!`,2];
  if(p>=75)return["Three quarters there. You're flying today.",1];
  if(p>=50)return["Past halfway. Keep that pace!",1];
  if(p>=25)return["Nice rhythm. Every check is altitude.",1];
  return["Good start. The trail begins with one step.",1]}
const gradeWord={"S+":"Unstoppable. Perfect streak!","S":"Perfect day. Summit pace!","A":"So close to perfect. Great day!","B":"Solid day. Push for a few more today.","C":"Halfway there. Today we climb higher.","D":"A start is a start. Let's double it today.","F":"Fresh day, fresh trail. One task at a time."};

// ---------- views ----------
function renderTop(){const t=totals(),d=new Date(),T=todayN(),L=C().len;
  $("#dayLbl").textContent=T<1?"Starts soon":T>L?"Challenge complete":`Day ${T} of ${L}`;
  $("#clock").textContent=d.toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"})+" · "+d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  $("#streak").textContent="🔥 "+t.cur;$("#coins").textContent="● "+t.coins.toLocaleString();
  document.querySelectorAll(".nav button").forEach(b=>b.dataset.v===view?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"))}

function vToday(){const T=todayN(),L=C().len;
  if(T>L||C().status!=="active")return vEnd();
  const r=rec(T)||[],n=N(),p=Math.round(r.length/n*100),[line,mood]=coachLine(p,r.length,n);
  let h="";
  const y=T-1;if(y>=1&&rec(y)!==null&&!S.seen[keyN(y)]){const g=grade(y);
    h+=`<div class="result"><div class="g">${g}</div><p><b>Day ${y} result</b> · ${(rec(y)||[]).length}/${n} tasks · +${coinsN(y)} coins<br>${gradeWord[g]}</p><button data-seen="${keyN(y)}" aria-label="Dismiss">✕</button></div>`}
  h+=`<div class="coach"><div class="bob">${falcon(58,mood)}</div><div class="bubble">${line}</div></div>
   <div class="prog"><b>${r.length} / ${n}</b><div class="meter"><div style="width:${p}%"></div></div></div>`;
  const todo=C().tasks.map((t,i)=>[t,i]).filter(([,i])=>!r.includes(i)),done=C().tasks.map((t,i)=>[t,i]).filter(([,i])=>r.includes(i));
  const row=([t,i],on)=>{const[em,name]=split(t);return`<button class="row ${on?"on":""}" data-k="${i}" ${ready?"":"disabled"}><span class="ck">${on?"✓":""}</span><span class="em">${em}</span><span class="t">${name}</span></button>`};
  if(todo.length)h+=`<div class="list">${todo.map(x=>row(x,0)).join("")}</div>`;
  if(done.length)h+=`<button class="fold" id="fold"><span>✓ ${done.length} done</span><span>${showDone||!todo.length?"Hide ▲":"Show ▼"}</span></button>`+((showDone||!todo.length)?`<div class="list">${done.map(x=>row(x,1)).join("")}</div>`:"");
  const ins=insights()[0];
  h+=ins?`<div class="note ${ins.k=="warm"?"warm":""}">${ins.t}</div>`:(y>=1&&rec(y)?`<div class="note">Yesterday you finished ${(rec(y)||[]).length} of ${n}. Beat it today and the trends start showing up here.</div>`:"");
  return`<div class="pad">${h}</div>`}

function vEnd(){const t=totals(),L=C().len,won=t.P===L;
  return`<div class="pad" style="text-align:center;align-items:center">${falcon(120,won?2:1)}
  <h2 style="font-family:var(--display);font-weight:400;font-size:30px;margin:0">${won?"You reached the summit!":"Challenge complete"}</h2>
  <p style="margin:0;max-width:34ch">${won?`${L} perfect days. That's a legendary climb.`:`${t.P} of ${L} perfect days. You climbed ${t.P} spaces. The summit needs every day perfect, so let's go again. You know the trail now.`}</p>
  <button class="btn" id="again">Start round ${S.ch.length+1}</button><button class="btn alt" data-goto="new">Build a new challenge</button></div>`}

function vMap(){const L=C().len,t=totals(),W=300,step=64,H=L*step+230,pts=[];
  for(let d=1;d<=L;d++)pts.push([150+Math.sin(d*.9)*82,H-90-(d-1)*step]);
  let seed=11;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  let g=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trail map: ${t.P} of ${L} spaces climbed">
  <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4cc3ff"/><stop offset=".3" stop-color="#9be3ff"/><stop offset=".5" stop-color="#b9f0a6"/><stop offset="1" stop-color="#6fdc5a"/></linearGradient></defs>
  <rect width="${W}" height="${H}" fill="url(#sk)"/>
  <g stroke="#16202b" stroke-width="3" stroke-linejoin="round">
  <path d="M-10 ${H*.4} L50 ${H*.16} L105 ${H*.24} L170 ${H*.02+44} L235 ${H*.2} L310 ${H*.32} L310 ${H*.45} L-10 ${H*.45}z" fill="#a3adc2"/>
  <path d="M170 ${H*.02+44} L235 ${H*.2} L205 ${H*.17} L188 ${H*.24}z M50 ${H*.16} L105 ${H*.24} L80 ${H*.23}z" fill="#6f7a92"/>
  <path d="M148 ${H*.02+70} L170 ${H*.02+44} L194 ${H*.02+74} L180 ${H*.02+66} L170 ${H*.02+80} L160 ${H*.02+68}z" fill="#fff"/>
  <path d="M-10 ${H*.58} C80 ${H*.54} 120 ${H*.64} 200 ${H*.6} S310 ${H*.56} 310 ${H*.56} L310 ${H*.62} C230 ${H*.64} 180 ${H*.7} 90 ${H*.65} S-10 ${H*.64} -10 ${H*.64}z" fill="#1a9dff"/>
  <path d="M30 ${H*.6} h22 M150 ${H*.625} h26 M240 ${H*.59} h18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>`;
  for(let i=0;i<50;i++){const y=H*.45+rnd()*H*.53,x=rnd()<.5?rnd()*70:230+rnd()*70;
    if(Math.abs(y-H*.6)<H*.05)continue;
    g+=y>H*.66||rnd()<.5?`<g stroke="#16202b" stroke-width="2.5" stroke-linejoin="round"><path d="M${x} ${y-28} L${x+14} ${y} L${x-14} ${y}z" fill="#14b85a"/><path d="M${x} ${y-28} L${x+14} ${y} L${x+3} ${y}z" fill="#0b8a41" stroke="none"/><rect x="${x-3}" y="${y}" width="6" height="7" fill="#9a5b2e"/></g>`
     :`<path d="M${x-11} ${y} L${x-4} ${y-11} L${x+9} ${y-9} L${x+13} ${y}z" fill="#a3adc2" stroke="#16202b" stroke-width="2.5"/>`}
  const pl=pts.map(p=>p.join(",")).join(" ");
  g+=`<polyline points="${pl}" fill="none" stroke="#16202b" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${pl}" fill="none" stroke="#fffdf7" stroke-width="9" stroke-dasharray="2 12" stroke-linecap="round"/>`;
  pts.forEach(([x,y],i)=>{const n=i+1,done=n<=t.P,cur=n===t.P+1,top=n===L,rx=top?27:22;
    g+=`<g class="mapnode" data-goto="today"><ellipse cx="${x}" cy="${y+6}" rx="${rx}" ry="11" fill="#16202b"/><ellipse cx="${x}" cy="${y}" rx="${rx}" ry="13" fill="${top?"#ffcc12":done?"#ff4f12":cur?"#fff":"#dfe5ee"}" stroke="#16202b" stroke-width="3"/>
    <text x="${x}" y="${y+5}" text-anchor="middle" font-family="Lilita One,sans-serif" font-size="14" fill="${done?"#fff":"#16202b"}">${top?"⚑":done?"★":n}</text></g>`;
    if(cur&&!top)g+=`<g transform="translate(${x-24} ${y-62})"><g class="bob">${falcon(48,2)}</g></g>`});
  g+=`<text x="150" y="${H*.02+30}" text-anchor="middle" font-family="Lilita One,sans-serif" font-size="17" fill="#16202b">SUMMIT · ${L} PERFECT DAYS</text></svg>`;
  return`<div class="map">${g}</div>`}

function vJournal(){const tabs=[["stats","Stats"],["cal","Calendar"],["badges","Badges"],["me","Profile"]];
  let h=`<div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${tab===k}">${l}</button>`).join("")}</div>`;
  const t=totals(),L=C().len,T=Math.min(todayN(),L);
  if(tab==="stats"){const fin=[];for(let n=1;n<T;n++)if(pctN(n)!=null)fin.push(n);
    const avg=fin.length?Math.round(fin.reduce((a,n)=>a+pctN(n),0)/fin.length):null;
    const avgG=avg==null?"–":avg===100?"S":avg>=85?"A":avg>=70?"B":avg>=50?"C":avg>0?"D":"F";
    h+=`<div class="stats"><div><span class="lbl">Perfect days</span><b>${t.P} / ${L}</b></div><div><span class="lbl">Coins</span><b>${t.coins.toLocaleString()}</b></div><div><span class="lbl">Perfect streak</span><b>🔥 ${t.cur}</b></div><div><span class="lbl">Average grade</span><b>${avgG}</b></div></div>
    <span class="lbl">Grades by day (finished days)</span><div class="bars">${Array.from({length:L},(_,i)=>{const n=i+1,p=n<T?pctN(n):null;return p==null?`<i class="x" title="Day ${n}"></i>`:`<i class="${p===100?"p":""}" style="height:${Math.max(p,3)}%" title="Day ${n}: ${grade(n)} (${p}%)"></i>`}).join("")}</div>
    <div class="scale">${[["S+","perfect streak"],["S","100%"],["A","85%+"],["B","70%+"],["C","50%+"],["D","under 50%"],["F","0%"]].map(([g,d])=>`<span><em>${g}</em>${d}</span>`).join("")}</div>
    ${insights().slice(0,4).map(i=>`<div class="note ${i.k=="warm"?"warm":""}">${i.t}</div>`).join("")||`<div class="note">Trends appear once you have two days in a row on a task.</div>`}`}
  else if(tab==="cal"){const today=todayN();if(sel==null)sel=Math.max(1,Math.min(today-1,L));
    h+=`<div class="cal">${"SMTWTFS".split("").map(c=>`<span>${c}</span>`).join("")}${"<span></span>".repeat(parse(C().start).getDay())}`;
    for(let n=1;n<=L;n++){const fut=n>today,live=n===today,p=pctN(n),g=n<today?grade(n):"";
      const cls=live?"today":fut?"":p==null?"nr":p===100?"p":p>=70?"ok":"lo";
      h+=`<button class="${cls} ${n===sel?"sel":""}" data-day="${n}" ${fut?"disabled":""} aria-label="Day ${n}">${n}${g?`<em>${g}</em>`:live?"<em>•</em>":""}</button>`}
    const live=sel===today,r=rec(sel),d=parse(keyN(sel));
    h+=`</div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>Day ${sel} · ${d.toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"})}</b>${live?`<button class="chip" data-goto="today">Open today ▸</button>`:`<span class="lock">🔒 Archived · ${grade(sel)}</span>`}</div>`;
    if(!live&&r===null)h+=`<div class="note">No record for this day. Archived days can't be changed.</div>`;
    else if(!live)h+=`<div class="list">${C().tasks.map((t,i)=>{const[em,name]=split(t),on=(r||[]).includes(i);return`<div class="row ${on?"on":""}" style="cursor:default"><span class="ck">${on?"✓":""}</span><span class="em">${em}</span><span class="t">${name}</span></div>`}).join("")}</div>`}
  else if(tab==="badges"){const B=[["👣","First step",Object.values(C().days).some(r=>r&&r.length)],["⭐","First perfect day",t.P>=1],["🔥","3-day streak",t.best>=3],["🌲","Leave the forest",t.P>=5],["🌊","Cross the river",t.P>=Math.ceil(L*.4)],["🔥","7-day streak",t.best>=7],["⛰","Halfway up",t.P>=Math.ceil(L/2)],["🪙","1,000 coins",t.coins>=1000],["🦅","Above the treeline",t.P>=Math.ceil(L*.75)],["💯","14-day streak",t.best>=14],["🪙","5,000 coins",t.coins>=5000],["⚑","Summit",t.P>=L]];
    const got=B.filter(b=>b[2]).length;
    h+=`<div class="coach">${falcon(50,1)}<div class="bubble">${got} of ${B.length} badges. ${t.P<1?"Your first perfect day unlocks the next one!":"Keep stacking perfect days!"}</div></div><div class="badges">${B.map(([i,l,on])=>`<div class="badge ${on?"on":"off"}"><b>${i}</b>${l}</div>`).join("")}</div>`}
  else{h+=`<span class="lbl">Your challenges</span><div class="hist">${S.ch.map((c,i)=>{const P=Object.entries(c.days).filter(([,r])=>r&&r.length===c.tasks.length).length;return`<div><span><b>${c.name}</b><br><small>Started ${parse(c.start).toLocaleDateString([], {month:"short",day:"numeric",year:"numeric"})} · ${c.tasks.length} tasks</small></span><span style="text-align:right">${P}/${c.len} perfect<br><small>${i===S.cur&&c.status==="active"?"In progress":c.status==="won"?"Summit ⚑":"Finished"}</small></span></div>`}).join("")}</div>
    <button class="btn alt" data-goto="new">Build a new challenge</button>
    <p class="lbl" style="margin:0;text-transform:none;letter-spacing:0;font-weight:700">${ref?"Progress is saved to your account.":"Progress is saved in this browser only."}</p>`}
  return`<div class="pad">${h}</div>`}

let draft=null;
function vNew(){draft=draft||{name:"30 Day Challenge",len:30,tasks:C().tasks.join("\n")};
  return`<div class="pad"><div class="coach">${falcon(56,1)}<div class="bubble">New climb! Name it, pick the length and list one task per line.</div></div>
  <label class="f"><span class="lbl">Challenge name</span><input type="text" id="nName" value="${draft.name.replace(/"/g,"&quot;")}"></label>
  <span class="lbl">Length in days</span><div class="lens">${[7,14,30,60].map(n=>`<button data-len="${n}" aria-pressed="${draft.len===n}">${n}</button>`).join("")}</div>
  <label class="f"><span class="lbl">Daily checklist (one per line)</span><textarea id="nTasks">${draft.tasks.replace(/</g,"&lt;")}</textarea></label>
  ${C().status==="active"&&todayN()<=C().len?`<div class="note warm">Starting this ends your current challenge. Its history stays in your profile.</div>`:""}
  <button class="btn" id="startNew">Start the climb today</button><button class="btn alt" data-goto="journal">Cancel</button></div>`}

function render(){renderTop();const v=$("#view");
  v.innerHTML=view==="map"?vMap():view==="journal"?vJournal():view==="new"?vNew():vToday();
  if(view==="map"){const t=totals(),L=C().len,H=L*64+230,y=H-90-Math.min(t.P,L-1)*64;requestAnimationFrame(()=>{const sc=v.scrollHeight/H;v.scrollTop=y*sc-v.clientHeight*.6})}}
function go(v){view=v;if(v!=="new")draft=null;v==="today"&&(sel=null);if(v!=="map")$("#view").scrollTop=0;render()}

function power(){sfx.win();const t=totals(),d=document.createElement("div");d.className="power";
  d.innerHTML=`<div class="rays"></div><div class="in">${falcon(130,2)}<h2>SUPERCHARGED!</h2><p>Perfect day · +${N()*COIN+BONUS} coins<br>Perfect streak 🔥 ${t.cur}<br>The falcon climbs to space ${t.P+1 > C().len ? C().len : t.P+1}</p><button class="btn" id="fly">Forge ahead ▸</button></div>`;
  $("#app").appendChild(d);d.querySelector("#fly").onclick=()=>{d.remove();go("map")}}

// ---------- events ----------
document.addEventListener("click",e=>{const el=e.target.closest("button,[data-goto]");if(!el)return;
  if(el.closest(".nav")){sfx.tap();go(el.dataset.v);return}
  if(el.dataset.goto){go(el.dataset.goto);return}
  if(el.id==="mute"){muted=!muted;el.textContent=muted?"🔇":"🔊";el.setAttribute("aria-label",muted?"Sound off":"Sound on");return}
  if(el.id==="fold"){showDone=!showDone;render();return}
  if(el.dataset.seen){S.seen[el.dataset.seen]=1;save();render();return}
  if(el.dataset.tab){tab=el.dataset.tab;render();return}
  if(el.dataset.day){sel=+el.dataset.day;if(sel===todayN())go("today");else render();return}
  if(el.dataset.len){draft.len=+el.dataset.len;render();return}
  if(el.classList.contains("row")&&el.dataset.k!=null&&view==="today"){if(!ready)return;
    const T=todayN();if(T<1||T>C().len)return;const k=keyN(T),i=+el.dataset.k;
    let r=(C().days[k]||[]).slice();const on=r.includes(i);r=on?r.filter(x=>x!==i):[...r,i];C().days[k]=r;
    on?sfx.un():sfx.check(r.length);save();render();
    const b=document.querySelector(`.row[data-k="${i}"]`);b&&b.classList.add("pop");
    if(r.length===N())setTimeout(power,300);return}
  if(el.id==="again"){const c=C();S.ch.push({name:c.name.replace(/ · Round \d+$/,"")+` · Round ${S.ch.length+1}`,start:keyOf(new Date()),len:c.len,tasks:c.tasks.slice(),status:"active",days:{}});c.status=totals().P===c.len?"won":"ended";S.cur=S.ch.length-1;save();go("today");return}
  if(el.id==="startNew"){const tasks=$("#nTasks").value.split("\n").map(s=>s.trim()).filter(Boolean);const name=$("#nName").value.trim()||"Daily Challenge";
    if(!tasks.length){toast("Add at least one task, one per line.");return}
    C().status="ended";S.ch.push({name,start:keyOf(new Date()),len:draft.len,tasks,status:"active",days:{}});S.cur=S.ch.length-1;save();go("today");toast("New challenge started. Day 1 begins now!");return}
});
document.addEventListener("input",e=>{if(!draft)return;if(e.target.id==="nName")draft.name=e.target.value;if(e.target.id==="nTasks")draft.tasks=e.target.value});

// clock + day rollover
let lastKey=keyOf(new Date());
setInterval(()=>{const k=keyOf(new Date());if(k!==lastKey){lastKey=k;render()}else renderTop()},20000);
render();boot();
</script>
