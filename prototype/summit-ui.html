<title>Summit Streak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one phone-width app column (top bar / view / bottom nav). Pop-art + anime: flat saturated fills, heavy ink, Ben-Day halftone. Light by choice. */
:root{
  --ink:#111318; --paper:#fffef8; --rule:#e9e4d6; --muted:#606a78; --ground:#ffe14d;
  --yellow:#ffe14d; --magenta:#ff2e88; --cyan:#00c2ff; --red:#ff3b30; --blue:#2f6df6;
  --green:#18c964; --green-d:#0e9a4a; --sky:#7fe0ff; --rock:#b9a2ff; --rock-d:#7d63e0;
  --display:"Bangers","Impact","Arial Black",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,sans-serif;
  --dots:radial-gradient(rgba(17,19,24,.14) 1.1px,transparent 1.4px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground) var(--dots);background-size:9px 9px;color:var(--ink);font-family:var(--body);font-weight:700;display:flex;justify-content:center}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--magenta);outline-offset:2px}
.app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;background:var(--paper);border-left:3px solid var(--ink);border-right:3px solid var(--ink);position:relative;overflow:hidden}
.top{display:flex;align-items:center;gap:8px;padding:9px max(14px,env(safe-area-inset-right,0px)) 9px max(14px,env(safe-area-inset-left,0px));border-bottom:3px solid var(--ink);background:var(--cyan) var(--dots);background-size:8px 8px;z-index:3}
.when{flex:1;min-width:0;line-height:1.05}
.when b{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:1px;color:#fff;-webkit-text-stroke:1.2px var(--ink);text-shadow:2px 2px 0 var(--ink)}
.when small{display:block;font-size:12px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border:2.5px solid var(--ink);border-radius:20px;background:#fff;font-weight:900;font-size:13px;font-variant-numeric:tabular-nums;box-shadow:2px 2px 0 var(--ink)}
.chip.fire{background:var(--red);color:#fff}
.chip.coin{background:var(--yellow)}
.icon{border:0;background:none;font-size:18px;cursor:pointer;padding:4px}
.view{flex:1;overflow-y:auto;position:relative;scrollbar-width:thin}
.pad{padding:14px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.nav{display:flex;border-top:3px solid var(--ink);background:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:0;background:none;padding:7px 0 8px;font-weight:900;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.nav button b{font-size:20px;line-height:1}
.nav button[aria-current=page]{color:var(--magenta)}
.lbl{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:900}
.btn{font:400 20px var(--display);letter-spacing:1px;border:3px solid var(--ink);border-radius:12px;padding:9px 14px;background:var(--magenta);color:#fff;box-shadow:4px 4px 0 var(--ink);cursor:pointer;width:100%}
.btn.alt{background:#fff;color:var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
/* comic speech */
.coach{display:flex;gap:8px;align-items:flex-end}
.coach svg{flex:none}
.bubble{background:#fff;border:3px solid var(--ink);border-radius:16px 16px 16px 4px;padding:8px 11px;font-size:14px;font-weight:800;flex:1;min-width:0;box-shadow:3px 3px 0 var(--ink)}
@keyframes bob{50%{transform:translateY(-3px)}}
.bob{animation:bob 1.4s ease-in-out infinite}
/* charge panel */
.charge{display:flex;align-items:center;gap:12px;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;background:var(--yellow) var(--dots);background-size:8px 8px;box-shadow:4px 4px 0 var(--ink)}
.charge .num{font-family:var(--display);font-size:40px;line-height:1;letter-spacing:1px;font-variant-numeric:tabular-nums}
.charge .num small{font-size:22px}
.charge p{margin:0;font-size:13px;font-weight:800;flex:1;min-width:0}
.bolt{flex:none;transition:filter .3s}
.bolt .fill{transition:y .45s cubic-bezier(.3,1.5,.5,1),height .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes zapGlow{0%,100%{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 8px var(--yellow))}50%{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 18px var(--magenta))}}
@keyframes shake{20%{transform:rotate(-8deg) scale(1.15)}40%{transform:rotate(7deg) scale(1.2)}60%{transform:rotate(-4deg) scale(1.1)}}
.bolt.lit{animation:zapGlow 1.2s ease-in-out infinite}
.bolt.kick{animation:shake .45s}
/* note-app list */
.note-list{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:4px 0;box-shadow:4px 4px 0 var(--ink)}
.line{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:5px 14px;border:0;border-bottom:1.5px solid var(--rule);background:none;text-align:left;font-size:15.5px;font-weight:700;cursor:pointer}
.line:last-child{border-bottom:0}
.line .tx{position:relative;flex:0 1 auto;min-width:0}
.line .tx::after{content:"";position:absolute;left:-2px;right:-2px;top:52%;height:2.5px;background:var(--magenta);border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform .28s ease-out}
.line.on .tx{color:var(--muted)}
.line.on .tx::after{transform:scaleX(1)}
.line .mk{width:24px;height:24px;flex:none;position:relative}
.line .mk svg{position:absolute;inset:0;overflow:visible}
.line .ck{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .12s ease-out}
.line.on .ck{stroke-dashoffset:0}
.line .ring{opacity:.35}
.line.on .ring{opacity:0}
@keyframes burst{0%{transform:scale(.2);opacity:1}70%{opacity:1}100%{transform:scale(1.7);opacity:0}}
.line .bst{opacity:0;transform-origin:12px 12px}
.line.pop .bst{animation:burst .5s ease-out}
.line[disabled]{cursor:default}
.note{border-radius:14px;padding:9px 12px;font-size:13.5px;font-weight:800;background:#e3f8ff;border:2.5px solid var(--ink)}
.note.warm{background:#ffe3ef}
.result{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:16px;padding:10px 12px;box-shadow:4px 4px 0 var(--magenta)}
.result .g{font-family:var(--display);font-size:46px;line-height:1;color:var(--yellow);min-width:48px;text-align:center}
.result p{margin:0;font-size:13px;flex:1;min-width:0}
.result button{border:0;background:none;color:#fff;font-size:18px;cursor:pointer}
/* coach pop-in */
.pop-coach{position:absolute;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));left:12px;z-index:7;display:flex;align-items:flex-end;gap:6px;flex-direction:row-reverse;pointer-events:none;animation:slideIn .35s cubic-bezier(.3,1.5,.5,1)}
.pop-coach.out{animation:slideOut .3s forwards}
@keyframes slideIn{from{transform:translateX(120%)}}
@keyframes slideOut{to{transform:translateX(120%)}}
.pop-coach .bubble{border-radius:16px 16px 4px 16px;flex:0 1 auto}
/* map */
.map{background:#9be86a;min-height:100%}
.map svg{display:block;width:100%;height:auto;max-height:100%}
.map .tap{cursor:pointer}
.mapinfo{position:absolute;left:10px;top:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.mapinfo span{background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:3px 9px;font-weight:900;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
@keyframes walk{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
.hiker .legA{animation:walk .6s ease-in-out infinite;transform-origin:24px 44px}
.hiker .legB{animation:walk .6s ease-in-out infinite reverse;transform-origin:24px 44px}
/* power-up */
.power{position:absolute;inset:0;z-index:9;display:grid;place-items:center;overflow:hidden;background:var(--magenta);text-align:center}
.power .rays{position:absolute;inset:-60%;background:repeating-conic-gradient(var(--yellow) 0 8deg,var(--magenta) 8deg 16deg);animation:spin 10s linear infinite}
.power .halftone{position:absolute;inset:0;background:radial-gradient(circle,transparent 30%,rgba(17,19,24,.0) 31%),var(--dots);background-size:auto,10px 10px}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes zap{0%{transform:scale(.2) rotate(-12deg)}60%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1)}}
.power .in{position:relative;animation:zap .5s cubic-bezier(.3,1.6,.5,1);display:flex;flex-direction:column;align-items:center}
.power h2{font-family:var(--display);font-weight:400;font-size:58px;letter-spacing:2px;line-height:.95;margin:0;color:var(--yellow);-webkit-text-stroke:2.5px var(--ink);text-shadow:5px 5px 0 var(--ink);transform:rotate(-4deg)}
.power p{margin:10px 24px 14px;font-weight:900;font-size:15px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 14px;box-shadow:4px 4px 0 var(--ink)}
.power .btn{background:var(--cyan);color:var(--ink);width:auto;padding:8px 24px}
/* journal */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{flex:1;border:2.5px solid var(--ink);border-radius:10px;padding:6px 0;background:#fff;font-weight:900;font-size:13px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.tab[aria-selected=true]{background:var(--magenta);color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;background:#fff;box-shadow:3px 3px 0 var(--ink)}
.stats b{font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:1px;display:block;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:3px solid var(--ink)}
.bars i{flex:1;min-width:0;border-radius:3px 3px 0 0;background:var(--cyan);border:1.5px solid var(--ink);border-bottom:0}
.bars i.p{background:var(--magenta)}
.bars i.x{background:none;border-style:dashed;height:4%}
.scale{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.scale span{display:inline-flex;gap:4px;align-items:center}
.scale em{font-style:normal;font-family:var(--display);color:var(--ink);font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal span{font-size:10px;text-align:center;color:var(--muted);font-weight:900}
.cal button{aspect-ratio:1;min-width:0;border:2.5px solid var(--ink);border-radius:9px;background:#fff;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-weight:900;font-size:11px}
.cal button em{font-style:normal;font-family:var(--display);font-size:16px}
.cal .p{background:var(--magenta);color:#fff}
.cal .ok{background:var(--yellow)}
.cal .lo{background:#ffd0c4}
.cal .nr{background:#eef0f4;color:var(--muted)}
.cal .today{background:var(--cyan)}
.cal .sel{outline:3px solid var(--blue);outline-offset:1px}
.cal button:disabled{background:transparent;border-style:dashed;border-color:#b8bfca;color:#b8bfca;cursor:default}
.lock{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:900;background:var(--ink);color:var(--yellow);padding:4px 10px;border-radius:10px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{border:2.5px solid var(--ink);border-radius:12px;padding:8px 4px;text-align:center;font-size:11.5px;font-weight:900;background:#fff}
.badge b{display:block;font-size:26px;line-height:1.15}
.badge.on{background:var(--yellow);box-shadow:3px 3px 0 var(--ink)}
.badge.off{opacity:.35;filter:grayscale(1)}
.hist{display:flex;flex-direction:column;gap:6px}
.hist div{display:flex;justify-content:space-between;gap:8px;border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;background:#fff;font-size:13px}
/* archived list reuses .list/.row */
.list{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:2px 0}
.row{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1.5px solid var(--rule);font-size:14.5px}
.row:last-child{border-bottom:0}
.row .ck{width:18px;flex:none;color:var(--green-d);font-weight:900}
.row .em{display:none}
.row.on .t{text-decoration:line-through;text-decoration-color:var(--magenta);text-decoration-thickness:2.5px;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px}
input[type=text],textarea{font:800 15px var(--body);border:2.5px solid var(--ink);border-radius:12px;padding:9px 11px;width:100%;background:#fff;color:var(--ink)}
textarea{min-height:200px;font-size:14px;line-height:1.45;resize:vertical}
.lens{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lens button{border:2.5px solid var(--ink);border-radius:12px;padding:8px 0;background:#fff;font-weight:900;cursor:pointer}
.lens button[aria-pressed=true]{background:var(--cyan)}
.toast{position:absolute;left:16px;right:16px;bottom:76px;z-index:8;background:var(--ink);color:#fff;border-radius:12px;padding:9px 12px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <div class="top">
    <div class="when"><b id="dayLbl">Day 4 of 30</b><small id="clock">Loading…</small></div>
    <span class="chip fire" id="streak" title="Perfect streak">🔥 0</span>
    <span class="chip coin" id="coins" title="Coins">● 60</span>
    <button class="icon" id="mute" aria-label="Sound on">🔊</button>
  </div>
  <div class="view" id="view"></div>
  <nav class="nav">
    <button data-v="map"><b>⛰</b>Map</button>
    <button data-v="today"><b>✓</b>Today</button>
    <button data-v="journal"><b>☰</b>Journal</button>
  </nav>
</div>

<script>
// ---------- data ----------
const T20=["💪 Daily strength (20–30 min)","🤸 Mobility training (10–15 min)","👟 Walk 10k steps (20k optimal)","✍️ Write 1–2 shitty pages","🎧 Make 1 shitty beat","📖 Read a book (10 pages)","🦶 Ground barefoot","☀️ Morning sunlight (5 min)","🥗 Eat clean: protein + fiber","📊 Track progress","🧘 Meditate (5 min)","🗣 Learn a language (5 min)","💧 Hydration / vits / supplements","🪑 Sit on the floor (5 min)","💬 Positive affirmations","🗓 Plan tomorrow (evening)","😴 Sleep 8–9 hours","📓 Journal your day","📵 Be conscious of screen time","📚 Study for 1 hour"];
// Starting state: your challenge began Nov 5 2026. Nov 5–6 have no record; Nov 7 from your checklist.
const SEED={v:1,cur:0,seen:{},ch:[{name:"30 Day Challenge",start:"2026-11-05",len:30,tasks:T20,status:"active",days:{"2026-11-05":null,"2026-11-06":null,"2026-11-07":[5,6,7,8,11,12]}}]};
const COIN=10,BONUS=50;
let S=JSON.parse(JSON.stringify(SEED)),ready=false,view="today",tab="stats",sel=null,muted=false;
const $=s=>document.querySelector(s);
const C=()=>S.ch[S.cur], N=()=>C().tasks.length;
const split=t=>{const m=t.match(/^(\S+)\s+(.*)$/);return m&&!/[A-Za-z0-9]/.test(m[1])?[m[1],m[2]]:["•",t]};

// ---------- dates ----------
const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const dayN=k=>Math.round((parse(k)-parse(C().start))/864e5)+1;
const keyN=n=>{const d=parse(C().start);d.setDate(d.getDate()+n-1);return keyOf(d)};
const todayN=()=>dayN(keyOf(new Date()));

// ---------- scoring ----------
const rec=n=>C().days[keyN(n)];            // array | null (no record) | undefined (nothing done)
const pctN=n=>{const r=rec(n);return r===null?null:Math.round((r||[]).length/N()*100)};
const perfect=n=>pctN(n)===100;
const runTo=n=>{let k=0;while(n>=1&&perfect(n)){k++;n--}return k};
function grade(n){const p=pctN(n);if(p==null)return"–";if(p===100)return runTo(n)>=2?"S+":"S";return p>=85?"A":p>=70?"B":p>=50?"C":p>0?"D":"F"}
const coinsN=n=>{const r=rec(n)||[];return r.length*COIN+(r.length===N()?BONUS:0)};
// pos: trail position in spaces. Each space = one 100% day; partial days move you part of a space.
function totals(){const T=Math.min(todayN(),C().len);let coins=0,P=0,best=0,run=0,pos=0;
  for(let n=1;n<=T;n++){coins+=coinsN(n);pos+=(rec(n)||[]).length/N();if(perfect(n)){P++;run++;best=Math.max(best,run)}else if(n<T)run=0}
  const cur=perfect(T)?runTo(T):runTo(T-1);
  return{coins,P,best,cur,T,pos:Math.min(pos,C().len)}}
function insights(){const T=Math.min(todayN(),C().len),out=[];
  C().tasks.forEach((t,i)=>{const[em,name]=split(t);let run=0,n=(rec(T)||[]).includes(i)?T:T-1;
    while(n>=1&&(rec(n)||[]).includes(i)){run++;n--}
    let miss=0;n=T-1;while(n>=1&&rec(n)!==null&&!(rec(n)||[]).includes(i)){miss++;n--}
    if(run>=2)out.push({k:"good",s:run,t:`${em} ${name}: ${run} days in a row. Great job, keep it rolling!`});
    if(miss>=2)out.push({k:"warm",s:miss,t:`${em} ${name} slipped ${miss} days running. Do it early today and break the pattern. You've got this.`})});
  return out.sort((a,b)=>b.s-a.s)}

// ---------- characters ----------
function falcon(size,mood){
 const wings=mood>1
  ?`<path d="M21 38 C11 35 3 26 2 12 C7 17 9 18 12 18 C11 21 13 22 16 22 C15 25 17 27 22 29z" fill="#2a54b8"/><path d="M43 38 C53 35 61 26 62 12 C57 17 55 18 52 18 C53 21 51 22 48 22 C49 25 47 27 42 29z" fill="#2a54b8"/>`
  :`<path d="M20 35 C14 45 16 55 24 62 L28 44z" fill="#2a54b8"/><path d="M44 35 C50 45 48 55 40 62 L36 44z" fill="#2a54b8"/>`;
 const eyes=mood>1
  ?`<path d="M24.5 21.5 q2.5 -3 5 0 M34.5 21.5 q2.5 -3 5 0" fill="none" stroke="#ffcc12" stroke-width="2.4"/>`
  :`<circle cx="27" cy="21" r="3.6" fill="#ffcc12"/><circle cx="37" cy="21" r="3.6" fill="#ffcc12"/><circle cx="27.4" cy="21" r="2.3" fill="#16202b" stroke="none"/><circle cx="37.4" cy="21" r="2.3" fill="#16202b" stroke="none"/><circle cx="28.2" cy="20.2" r=".8" fill="#fff" stroke="none"/><circle cx="38.2" cy="20.2" r=".8" fill="#fff" stroke="none"/>`;
 return`<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true"><g stroke="#16202b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
 <path d="M27 56 L32 63 L37 56z" fill="#2a54b8"/>
 <ellipse cx="32" cy="44" rx="13" ry="15" fill="#3f78f0"/>
 <path d="M32 29 C40 31 45 38 45 45 C45 53 39 59 32 59z" fill="#2a54b8" stroke="none"/>
 <ellipse cx="32" cy="46" rx="8" ry="10" fill="#fff6e2"/>
 <path d="M28 42 l2 1.5 2-1.5 2 1.5 2-1.5 M27.5 47 l2 1.5 2.5-1.5 2.5 1.5 2-1.5 M29 52 l1.5 1 1.5-1 1.5 1 1.5-1" fill="none" stroke-width="1.4"/>
 <ellipse cx="32" cy="44" rx="13" ry="15" fill="none"/>
 ${wings}
 <circle cx="32" cy="21" r="12.5" fill="#fff6e2"/>
 <path d="M19.6 22 C19.6 12 25 8.5 32 8.5 C39 8.5 44.4 12 44.4 22 C44.4 26 43 29 40.5 31.5 C39.5 28 38.5 26.5 37 26 C34 27 30 27 27 26 C25.5 26.5 24.5 28 23.5 31.5 C21 29 19.6 26 19.6 22z" fill="#1b2f6b"/>
 ${eyes}
 <path d="M29.6 24.5 h4.8 c.4 3 -.6 5.4 -2.2 7.4 c-1.4 -1.2 -2.4 -2.6 -2.6 -4z" fill="#ffcc12"/>
 <path d="M32.3 30 l.9 1.6" stroke-width="1.8"/>
 </g></svg>`}
// the player: anime-style hiker with a big backpack, facing right
function hiker(size,charged){return`<svg class="hiker" width="${size}" height="${size*64/48}" viewBox="0 0 48 64" aria-hidden="true"><g stroke="#111318" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
 ${charged?`<path d="M4 30 L10 26 L8 33 L14 29 M42 18 L46 12 L45 20" fill="none" stroke="#ffe14d" stroke-width="3"/>`:""}
 <line x1="37" y1="31" x2="41" y2="62" stroke-width="2.4"/>
 <g class="legB"><path d="M22 44 L20 56" stroke-width="5" stroke="#f2c29a"/><path d="M22 44 L20 56" stroke-width="1" fill="none"/><path d="M16 56 h8 v4 h-9z" fill="#8a4b21"/></g>
 <g class="legA"><path d="M27 44 L29 56" stroke-width="5" stroke="#f2c29a"/><path d="M26 56 h8 l1 4 h-9z" fill="#8a4b21"/></g>
 <path d="M19 38 h11 l1 8 h-13z" fill="#2f3f8f"/>
 <rect x="8" y="20" width="12" height="20" rx="4" fill="#ff7a1a"/>
 <rect x="8" y="27" width="12" height="5" fill="#d9590a"/>

// lightning-bolt charge meter: fills with each task, ignites at 100%
const BOLT="M26 2 L6 34 H20 L14 58 L36 22 H22 L30 2z";
function bolt(size,p,id){const h=56*p/100;return`<svg class="bolt ${p>=100?"lit":""}" id="${id||""}" width="${size*0.7}" height="${size}" viewBox="0 0 42 60" aria-hidden="true">
 <defs><clipPath id="bc${id}"><path d="${BOLT}"/></clipPath><pattern id="hd${id}" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.1" fill="rgba(17,19,24,.18)"/></pattern></defs>
 <path d="${BOLT}" fill="#fff"/>
 <g clip-path="url(#bc${id})"><rect class="fill" x="0" y="${58-h}" width="42" height="${h+2}" fill="${p>=100?"#ffe14d":"#ff2e88"}"/><rect width="42" height="60" fill="url(#hd${id})"/></g>
 <path d="${BOLT}" fill="none" stroke="#111318" stroke-width="3" stroke-linejoin="round"/></svg>`}

// ---------- sound ----------
let ac;
function tone(f,t=0,d=.12,type="square",v=.05){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime+t);g.gain.setValueAtTime(v,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t+d);o.connect(g).connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d)}catch(e){}}
const sfx={check:n=>{const f=523*Math.pow(2,(n%12)/12);tone(f,0,.08);tone(f*1.5,.05,.1);tone(f*2,.1,.14,"triangle",.04)},
  un:()=>tone(196,0,.1,"triangle"),
  win:()=>{[523,659,784,1047,1319,1568,2093].forEach((f,i)=>tone(f,i*.07,.3));tone(98,0,.6,"sawtooth",.04)},
  tap:()=>tone(660,0,.05,"triangle",.03)};

// ---------- storage: private per-user db doc, local fallback ----------
let ref=null,writing=Promise.resolve(),saveT;
function save(){try{localStorage.setItem("summit",JSON.stringify(S))}catch(e){}
  if(!ref)return;clearTimeout(saveT);saveT=setTimeout(()=>{const data=JSON.parse(JSON.stringify(S));
   writing=writing.then(()=>ref.set(data)).catch(()=>toast("Couldn't save your progress. Check your connection and try again."))},500)}
async function boot(){
  try{const c=window.claude;if(c&&c.use){
    const [db,u]=await Promise.race([Promise.all([c.use("db"),c.use("user")]),new Promise(r=>setTimeout(()=>r([null,null]),10000))]);
    const id=u&&await u.id();
    if(db&&id){ref=db.collection("data/users/"+id).doc("summit");const s=await ref.get();if(s.exists&&s.data().ch)S=JSON.parse(JSON.stringify(s.data()));}}}catch(e){ref=null}
  if(!ref){try{const j=localStorage.getItem("summit");if(j)S=JSON.parse(j)}catch(e){}}
  ready=true;render()}

function coach(text,mood=1){const old=$(".pop-coach");old&&old.remove();clearTimeout(coachT);
  const d=document.createElement("div");d.className="pop-coach";d.innerHTML=`${falcon(64,mood)}<div class="bubble">${text}</div>`;$("#app").appendChild(d);
  coachT=setTimeout(()=>{d.classList.add("out");setTimeout(()=>d.remove(),320)},3600)}

const gradeWord={"S+":"Unstoppable. Perfect streak!","S":"Perfect day. Summit pace!","A":"So close to perfect. Great day!","B":"Solid day. Push for a few more today.","C":"Halfway there. Today we climb higher.","D":"A start is a start. Let's double it today.","F":"Fresh day, fresh trail. One task at a time."};

const MK=`<svg viewBox="0 0 24 24"><path class="bst" d="M12 0 L14 8 L22 4 L16 11 L24 13 L16 15 L20 22 L13 17 L11 24 L9 17 L2 21 L7 14 L0 11 L8 9 L4 2 L11 7z" fill="#ffe14d" stroke="#111318" stroke-width="1.2"/><circle class="ring" cx="12" cy="12" r="9" fill="none" stroke="#111318" stroke-width="2.2"/><path class="ck" d="M5 12.5 L10 17.5 L19.5 6.5" fill="none" stroke="#18c964" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path class="ck" d="M5 12.5 L10 17.5 L19.5 6.5" fill="none" stroke="#111318" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function vToday(){const T=todayN(),L=C().len;
  if(T>L||C().status!=="active")return vEnd();
  const r=rec(T)||[],n=N(),p=Math.round(r.length/n*100),t=totals();
  let h="";
  const y=T-1;if(y>=1&&rec(y)!==null&&!S.seen[keyN(y)]){const g=grade(y);
    h+=`<div class="result"><div class="g">${g}</div><p><b>Day ${y} result</b> · ${(rec(y)||[]).length}/${n} tasks · +${coinsN(y)} coins<br>${gradeWord[g]}</p><button data-seen="${keyN(y)}" aria-label="Dismiss">✕</button></div>`}
  h+=`<div class="charge">${bolt(64,p,"tb")}<div class="num">${r.length}<small> / ${n}</small></div><p>${p>=100?`PERFECT DAY! Streak 🔥 ${t.cur}`:`Fill the bolt for a perfect day.<br>${n-r.length} to go · streak 🔥 ${t.cur}`}</p></div>`;
  h+=`<div class="note-list">${C().tasks.map((tk,i)=>{const[,name]=split(tk),on=r.includes(i);return`<button class="line ${on?"on":""}" data-k="${i}" ${ready?"":"disabled"} aria-pressed="${on}"><span class="mk">${MK}</span><span class="tx">${name}</span></button>`}).join("")}</div>`;
  const ins=insights()[0];
  if(ins)h+=`<div class="coach">${falcon(52,ins.k=="warm"?1:2)}<div class="bubble">${ins.t}</div></div>`;
  return`<div class="pad">${h}</div>`}

function vEnd(){const t=totals(),L=C().len,won=t.P===L;
  return`<div class="pad" style="text-align:center;align-items:center">${won?hiker(110,1):falcon(110,1)}
  <h2 style="font-family:var(--display);font-weight:400;font-size:38px;letter-spacing:1px;margin:0">${won?"You reached the summit!":"Challenge complete"}</h2>
  <p style="margin:0;max-width:34ch">${won?`${L} perfect days. That's a legendary climb.`:`You hiked ${t.pos.toFixed(1)} of ${L} spaces with ${t.P} perfect days. The summit needs every day perfect, so let's go again. You know the trail now.`}</p>
  <button class="btn" id="again">Start round ${S.ch.length+1}</button><button class="btn alt" data-goto="new">Build a new challenge</button></div>`}

// compact overworld: serpentine trail, 6 rows x 5 spaces, base camp → summit
function trailPts(L){const W=360,rows=6,per=Math.ceil(L/rows),ys=[540,468,396,324,252,180],pts=[[46,600]];
  for(let i=0;i<L;i++){const r=Math.floor(i/per),c=i%per,cols=Math.min(per,L-r*per),x=46+(cols>1?c*(268/(per-1)):0);pts.push([r%2?W-x:x,ys[r]])}
  pts[L]=[180,70];return pts}
function along(pts,pos){const i=Math.min(Math.floor(pos),pts.length-2),f=pos-i,[a,b]=[pts[i],pts[i+1]];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,i]}
function vMap(){const L=C().len,t=totals(),pts=trailPts(L),W=360,H=640;
  let seed=5;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const tree=(x,y,s=1)=>`<g stroke="#111318" stroke-width="2.4" stroke-linejoin="round"><path d="M${x} ${y-24*s} L${x+12*s} ${y} L${x-12*s} ${y}z" fill="#18c964"/><path d="M${x} ${y-24*s} L${x+12*s} ${y} L${x+3*s} ${y}z" fill="#0e9a4a" stroke="none"/><path d="M${x} ${y-24*s} L${x+12*s} ${y} L${x-12*s} ${y}z" fill="none"/></g>`;
  const rock=(x,y)=>`<path d="M${x-12} ${y} L${x-5} ${y-12} L${x+8} ${y-10} L${x+13} ${y}z" fill="#b9a2ff" stroke="#111318" stroke-width="2.4"/>`;
  let g=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trail map: ${t.pos.toFixed(1)} of ${L} spaces hiked">
  <defs><pattern id="ht" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.3" fill="rgba(17,19,24,.13)"/></pattern></defs>
  <rect width="${W}" height="${H}" fill="#7fe0ff"/>
  <g stroke="#111318" stroke-width="3" stroke-linejoin="round">
   <path d="M-10 230 L70 120 L120 160 L180 40 L245 150 L290 110 L370 220 L370 300 L-10 300z" fill="#b9a2ff"/>
   <path d="M180 40 L245 150 L215 135 L200 175z M70 120 L120 160 L95 158z" fill="#7d63e0"/>
   <path d="M160 80 L180 40 L202 84 L190 76 L180 92 L170 78z" fill="#fff"/>
   <path d="M-10 290 C60 250 120 300 180 270 S300 250 370 280 L370 ${H} L-10 ${H}z" fill="#9be86a"/>
   <path d="M-10 430 C80 410 140 440 220 425 S320 415 370 430 L370 446 C300 440 230 456 150 448 S40 440 -10 448z" fill="#2f6df6"/>
  </g>
  <rect width="${W}" height="${H}" fill="url(#ht)"/>
  <path d="M30 437 h18 M120 442 h20 M250 434 h16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`;
  // scenery between rows
  [[576,"t"],[504,"t"],[360,"f"],[288,"r"],[216,"r"]].forEach(([y,k])=>{for(let i=0;i<4;i++){const x=85+i*64+rnd()*20;g+=k=="t"?tree(x,y+10,.8):k=="r"?rock(x,y+8):`<g stroke="#111318" stroke-width="1.6"><circle cx="${x}" cy="${y}" r="4" fill="#ff2e88"/><circle cx="${x+14}" cy="${y+6}" r="3.5" fill="#ffe14d"/></g>`}});
  [[14,520],[346,500],[12,470],[348,575],[16,380],[344,360]].forEach(([x,y])=>g+=tree(x,y,.9));
  // trail: full dashed, hiked part solid
  const pl=pts.map(p=>p.join(",")).join(" "),[hx,hy,hi]=along(pts,t.pos),done=pts.slice(0,hi+1).concat([[hx,hy]]).map(p=>p.join(",")).join(" ");
  g+=`<polyline points="${pl}" fill="none" stroke="#111318" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="${pl}" fill="none" stroke="#fffef8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 10"/>
  <polyline points="${done}" fill="none" stroke="#ff2e88" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="${pts[0][0]-30}" y="${pts[0][1]-8}" width="60" height="18" rx="6" fill="#ffe14d" stroke="#111318" stroke-width="2.4"/><text x="${pts[0][0]}" y="${pts[0][1]+6}" text-anchor="middle" font-family="Bangers,Impact,sans-serif" font-size="13" fill="#111318">BASE CAMP</text>`;
  // bridge where the trail crosses the river
  g+=`<g stroke="#111318" stroke-width="2.4"><rect x="${pts[10][0]-12}" y="423" width="24" height="28" rx="3" fill="#c98a4b"/><path d="M${pts[10][0]-12} 430 h24 M${pts[10][0]-12} 437 h24 M${pts[10][0]-12} 444 h24" stroke-width="1.4"/></g>`;
  for(let n=1;n<=L;n++){const[x,y]=pts[n],reached=t.pos>=n-1e-9,top=n===L;
    g+=top?`<g class="tap" data-goto="today"><path d="M${x} ${y+14} V${y-26}" stroke="#111318" stroke-width="3"/><path d="M${x} ${y-26} L${x+24} ${y-18} L${x} ${y-10}z" fill="#ff3b30" stroke="#111318" stroke-width="2.4"/><circle cx="${x}" cy="${y+14}" r="11" fill="${reached?"#ffe14d":"#fff"}" stroke="#111318" stroke-width="3"/></g>`
    :`<g class="tap" data-goto="today"><circle cx="${x}" cy="${y+3}" r="11" fill="#111318"/><circle cx="${x}" cy="${y}" r="11" fill="${reached?"#ffe14d":"#fff"}" stroke="#111318" stroke-width="3"/>${n%5==0?`<text x="${x}" y="${y+5}" text-anchor="middle" font-family="Bangers,Impact,sans-serif" font-size="13" fill="#111318">${n}</text>`:""}</g>`}
  g+=`<g transform="translate(${hx-17} ${hy-50})" class="tap" data-goto="today">${hiker(34,t.cur>0)}</g></svg>`;
  return`<div class="map" style="position:relative">${g}<div class="mapinfo"><span>⛰ ${t.pos.toFixed(1)} / ${L} spaces</span><span>★ ${t.P} perfect</span></div></div>`}

function vJournal(){const tabs=[["stats","Stats"],["cal","Calendar"],["badges","Badges"],["me","Profile"]];
  let h=`<div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${tab===k}">${l}</button>`).join("")}</div>`;
  const t=totals(),L=C().len,T=Math.min(todayN(),L);
  if(tab==="stats"){const fin=[];for(let n=1;n<T;n++)if(pctN(n)!=null)fin.push(n);
    const avg=fin.length?Math.round(fin.reduce((a,n)=>a+pctN(n),0)/fin.length):null;
    const avgG=avg==null?"–":avg===100?"S":avg>=85?"A":avg>=70?"B":avg>=50?"C":avg>0?"D":"F";
    h+=`<div class="stats"><div><span class="lbl">Perfect days</span><b>${t.P} / ${L}</b></div><div><span class="lbl">Coins</span><b>${t.coins.toLocaleString()}</b></div><div><span class="lbl">Trail hiked</span><b>${t.pos.toFixed(1)} / ${L}</b></div><div><span class="lbl">Best streak</span><b>🔥 ${t.best}</b></div><div><span class="lbl">Perfect streak</span><b>🔥 ${t.cur}</b></div><div><span class="lbl">Average grade</span><b>${avgG}</b></div></div>
    <span class="lbl">Grades by day (finished days)</span><div class="bars">${Array.from({length:L},(_,i)=>{const n=i+1,p=n<T?pctN(n):null;return p==null?`<i class="x" title="Day ${n}"></i>`:`<i class="${p===100?"p":""}" style="height:${Math.max(p,3)}%" title="Day ${n}: ${grade(n)} (${p}%)"></i>`}).join("")}</div>
    <div class="scale">${[["S+","perfect streak"],["S","100%"],["A","85%+"],["B","70%+"],["C","50%+"],["D","under 50%"],["F","0%"]].map(([g,d])=>`<span><em>${g}</em>${d}</span>`).join("")}</div>
    ${insights().slice(0,4).map(i=>`<div class="note ${i.k=="warm"?"warm":""}">${i.t}</div>`).join("")||`<div class="note">Trends appear once you have two days in a row on a task.</div>`}`}
  else if(tab==="cal"){const today=todayN();if(sel==null)sel=Math.max(1,Math.min(today-1,L));
    h+=`<div class="cal">${"SMTWTFS".split("").map(c=>`<span>${c}</span>`).join("")}${"<span></span>".repeat(parse(C().start).getDay())}`;
    for(let n=1;n<=L;n++){const fut=n>today,live=n===today,p=pctN(n),g=n<today?grade(n):"";
      const cls=live?"today":fut?"":p==null?"nr":p===100?"p":p>=70?"ok":"lo";
      h+=`<button class="${cls} ${n===sel?"sel":""}" data-day="${n}" ${fut?"disabled":""} aria-label="Day ${n}">${n}${g?`<em>${g}</em>`:live?"<em>•</em>":""}</button>`}
    const live=sel===today,r=rec(sel),d=parse(keyN(sel));
    h+=`</div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>Day ${sel} · ${d.toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"})}</b>${live?`<button class="chip" data-goto="today">Open today ▸</button>`:`<span class="lock">🔒 Archived · ${grade(sel)}</span>`}</div>`;
    if(!live&&r===null)h+=`<div class="note">No record for this day. Archived days can't be changed.</div>`;
    else if(!live)h+=`<div class="list">${C().tasks.map((t,i)=>{const[em,name]=split(t),on=(r||[]).includes(i);return`<div class="row ${on?"on":""}" style="cursor:default"><span class="ck">${on?"✓":""}</span><span class="em">${em}</span><span class="t">${name}</span></div>`}).join("")}</div>`}
  else if(tab==="badges"){const B=[["👣","First step",Object.values(C().days).some(r=>r&&r.length)],["⭐","First perfect day",t.P>=1],["🔥","3-day streak",t.best>=3],["🌲","Leave the forest",t.P>=5],["🌊","Cross the river",t.P>=Math.ceil(L*.4)],["🔥","7-day streak",t.best>=7],["⛰","Halfway up",t.P>=Math.ceil(L/2)],["🪙","1,000 coins",t.coins>=1000],["🦅","Above the treeline",t.P>=Math.ceil(L*.75)],["💯","14-day streak",t.best>=14],["🪙","5,000 coins",t.coins>=5000],["⚑","Summit",t.P>=L]];
    const got=B.filter(b=>b[2]).length;
    h+=`<div class="coach">${falcon(50,1)}<div class="bubble">${got} of ${B.length} badges. ${t.P<1?"Your first perfect day unlocks the next one!":"Keep stacking perfect days!"}</div></div><div class="badges">${B.map(([i,l,on])=>`<div class="badge ${on?"on":"off"}"><b>${i}</b>${l}</div>`).join("")}</div>`}
  else{h+=`<span class="lbl">Your challenges</span><div class="hist">${S.ch.map((c,i)=>{const P=Object.entries(c.days).filter(([,r])=>r&&r.length===c.tasks.length).length;return`<div><span><b>${c.name}</b><br><small>Started ${parse(c.start).toLocaleDateString([], {month:"short",day:"numeric",year:"numeric"})} · ${c.tasks.length} tasks</small></span><span style="text-align:right">${P}/${c.len} perfect<br><small>${i===S.cur&&c.status==="active"?"In progress":c.status==="won"?"Summit ⚑":"Finished"}</small></span></div>`}).join("")}</div>
    <button class="btn alt" data-goto="new">Build a new challenge</button>
    <p class="lbl" style="margin:0;text-transform:none;letter-spacing:0;font-weight:700">${ref?"Progress is saved to your account.":"Progress is saved in this browser only."}</p>`}
  return`<div class="pad">${h}</div>`}

function power(){sfx.win();const t=totals(),d=document.createElement("div");d.className="power";
  d.innerHTML=`<div class="rays"></div><div class="halftone"></div><div class="in"><div style="display:flex;align-items:flex-end;gap:4px">${bolt(80,100,"pw")}${hiker(96,1)}</div><h2>PERFECT<br>DAY!</h2><p>+${N()*COIN+BONUS} coins · Streak 🔥 ${t.cur}<br>One full space up the trail</p><button class="btn" id="fly">Forge ahead ▸</button></div>`;

// ---------- events ----------
document.addEventListener("click",e=>{const el=e.target.closest("button,[data-goto]");if(!el)return;
  if(el.closest(".nav")){sfx.tap();go(el.dataset.v);return}
  if(el.dataset.goto){go(el.dataset.goto);return}
  if(el.id==="mute"){muted=!muted;el.textContent=muted?"🔇":"🔊";el.setAttribute("aria-label",muted?"Sound off":"Sound on");return}
  if(el.dataset.seen){S.seen[el.dataset.seen]=1;save();render();return}
  if(el.dataset.tab){tab=el.dataset.tab;render();return}
  if(el.dataset.day){sel=+el.dataset.day;if(sel===todayN())go("today");else render();return}
  if(el.dataset.len){draft.len=+el.dataset.len;render();return}
  if(el.classList.contains("line")){if(!ready)return;
    const T=todayN();if(T<1||T>C().len)return;const k=keyN(T),i=+el.dataset.k,n=N();
    let r=(C().days[k]||[]).slice();const on=r.includes(i),before=Math.round(r.length/n*100);r=on?r.filter(x=>x!==i):[...r,i];C().days[k]=r;
    const p=Math.round(r.length/n*100);on?sfx.un():sfx.check(r.length);save();
    // update in place so the strike + check animations play
    el.classList.toggle("on",!on);el.setAttribute("aria-pressed",!on);if(!on){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}
    const ch=$(".charge");if(ch){ch.outerHTML=vToday().match(/<div class="charge">[\s\S]*?<\/p><\/div>/)[0];const b=$("#tb");if(b&&!on){b.classList.add("kick");setTimeout(()=>b.classList.remove("kick"),460)}}
    renderTop();
    if(!on){if(r.length===n)setTimeout(power,450);else{const m=[90,75,50,25].find(x=>before<x&&p>=x);if(m)coach(...CHEERS[m])}}
    return}
  if(el.id==="again"){const c=C();S.ch.push({name:c.name.replace(/ · Round \d+$/,"")+` · Round ${S.ch.length+1}`,start:keyOf(new Date()),len:c.len,tasks:c.tasks.slice(),status:"active",days:{}});c.status=totals().P===c.len?"won":"ended";S.cur=S.ch.length-1;save();go("today");return}
  if(el.id==="startNew"){const tasks=$("#nTasks").value.split("\n").map(s=>s.trim()).filter(Boolean);const name=$("#nName").value.trim()||"Daily Challenge";
    if(!tasks.length){toast("Add at least one task, one per line.");return}
    C().status="ended";S.ch.push({name,start:keyOf(new Date()),len:draft.len,tasks,status:"active",days:{}});S.cur=S.ch.length-1;save();go("today");toast("New challenge started. Day 1 begins now!");return}
});
document.addEventListener("input",e=>{if(!draft)return;if(e.target.id==="nName")draft.name=e.target.value;if(e.target.id==="nTasks")draft.tasks=e.target.value});

// clock + day rollover
let lastKey=keyOf(new Date());
setInterval(()=>{const k=keyOf(new Date());if(k!==lastKey){lastKey=k;render()}else renderTop()},20000);
render();boot();
</script>
